name: Release

# Tag-triggered release, with a guarded manual recovery path for an immutable
# tag whose original run failed before publishing any assets. Versions follow
# loxilb-io/loxilb-inference-gateway —
# vMAJOR.MINOR.PATCH with an optional build component (v0.9.8.6), or a
# -rc./-alpha./-beta. suffix for a prerelease; the tag is validated below and
# stamped into the binary. Produces a linux/amd64 + linux/arm64 binary tarball,
# SHA256SUMS, an SPDX SBOM, signed build provenance, and machine-readable
# release metadata attached to a GitHub Release.
#
# Release-input rules enforced here:
#   - only an annotated v* tag reaches the build; both the normal push path and
#     manual recovery path verify the tag object and exact peeled commit
#     without coupling the GitHub-hosted runner to any external key or server
#   - manual recovery requires the expected full source SHA and rejects the
#     build if the immutable tag resolves anywhere else
#   - the resolved commit is recorded and re-verified from inside the binary
#   - a dirty tree, or generated files modified by the build, fail the job
#   - each binary is built twice from identical inputs; a differing pair is a
#     reproducibility failure that blocks the release
#
# AUTHORIZATION: this job targets the `release` Environment with required
# reviewers. Both tag pushes and manual recovery therefore require an
# independent approval; the actor cannot self-approve the deployment.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to recover
        required: true
        type: string
      expected_source_revision:
        description: Full 40-character commit SHA the tag must resolve to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign build provenance
      attestations: write # store build provenance
      artifact-metadata: write # associate attestations with release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG}"
          # Lockstep with loxilb-inference-gateway: vMAJOR.MINOR.PATCH with an
          # optional fourth build component, plus an optional -rc/-alpha/-beta
          # prerelease suffix. Reject anything else so a stray tag cannot
          # publish a release.
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-(rc|alpha|beta)[.-]?[0-9]+)?$'; then
            echo "::error::'${VERSION}' is not a valid version: expected vMAJOR.MINOR.PATCH[.BUILD][-rc.N] (e.g. v0.9.8.6)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -Eq -- '-(rc|alpha|beta)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve and verify build inputs
        id: inputs
        env:
          EXPECTED_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_source_revision || github.sha }}
          RELEASE_TAG: ${{ steps.ver.outputs.version }}
        run: |
          if ! echo "$EXPECTED_SOURCE" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected source revision must be a full lowercase 40-character SHA"
            exit 1
          fi

          TAG_REF="refs/tags/${RELEASE_TAG}"
          if [ "$(git cat-file -t "$TAG_REF")" != "tag" ]; then
            echo "::error::${RELEASE_TAG} is not an annotated tag object"
            exit 1
          fi

          # The commit the annotated tag resolved to is the one identity every
          # later step verifies against. A moving or mismatched ref is fatal.
          REV="$(git rev-parse "${TAG_REF}^{}")"
          HEAD_REV="$(git rev-parse HEAD)"
          if [ "$REV" != "$EXPECTED_SOURCE" ] || [ "$HEAD_REV" != "$REV" ]; then
            echo "::error::tag=${REV} checkout=${HEAD_REV} expected=${EXPECTED_SOURCE}"
            exit 1
          fi
          # A release builds a committed tree, nothing else.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::working tree is dirty; a release builds only committed sources"
            exit 1
          fi
          if git submodule status --recursive 2>/dev/null | grep -Eq '^[+U-]'; then
            echo "::error::unexpected submodule state"
            exit 1
          fi
          # Reproducible timestamp: the commit time, not the build time.
          SDE="$(git log -1 --pretty=%ct)"
          # The gateway API contract this CLI consumes, from the pinned
          # manifest (verified against the gateway spec by build.yml).
          CONTRACT="$(sed -n 's/.*"swagger_sha256": "\([0-9a-f]*\)".*/\1/p' testdata/contracts/gateway-api.json)"
          if [ -z "$CONTRACT" ]; then
            echo "::error::could not read the gateway contract digest from testdata/contracts/gateway-api.json"
            exit 1
          fi
          {
            echo "revision=${REV}"
            echo "tag_object=$(git rev-parse "$TAG_REF")"
            echo "sde=${SDE}"
            echo "contract=${CONTRACT}"
            echo "workflow=${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BODY="${RUNNER_TEMP}/existing-release.json"
          HTTP_STATUS="$(curl --silent --show-error --location \
            --output "$BODY" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}")"
          case "$HTTP_STATUS" in
            404) ;;
            200)
              echo "::error::release ${VERSION} already exists; refusing to replace or update it"
              exit 1
              ;;
            *)
              echo "::error::could not prove release absence (HTTP ${HTTP_STATUS})"
              exit 1
              ;;
          esac
          DRAFT_IDS="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"${VERSION}\") | .id")"
          if [ -n "$DRAFT_IDS" ]; then
            echo "::error::draft release ${VERSION} already exists (id ${DRAFT_IDS//$'\n'/,}); refusing to replace or update it"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.0'
          cache: true

      - name: Verify release toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.25.0"

      - name: Build binaries (twice, proving reproducibility)
        env:
          CGO_ENABLED: 0
          VERSION: ${{ steps.ver.outputs.version }}
          REV: ${{ steps.inputs.outputs.revision }}
          SDE: ${{ steps.inputs.outputs.sde }}
          CONTRACT: ${{ steps.inputs.outputs.contract }}
          WORKFLOW: ${{ steps.inputs.outputs.workflow }}
        run: |
          BUILDINFO="$(date -u -d "@${SDE}" '+%Y_%m_%d')-release-$(git rev-parse --short HEAD)"
          MOD="github.com/loxilb-io/loxicmd-inference-gateway/cmd"
          # Release identity is injected explicitly below. Omit Go's implicit
          # linker build ID so cold-cache and warm-cache links are byte-identical.
          LDFLAGS="-buildid= \
                   -X '${MOD}.Version=${VERSION}' \
                   -X '${MOD}.BuildInfo=${BUILDINFO}' \
                   -X '${MOD}.SourceRevision=${REV}' \
                   -X '${MOD}.GatewayContract=${CONTRACT}' \
                   -X '${MOD}.BuildWorkflow=${WORKFLOW}' \
                   -X '${MOD}.SourceDateEpoch=${SDE}'"
          for arch in amd64 arm64; do
            for round in 1 2; do
              # REV above is the verified, explicitly embedded source identity;
              # do not add runner-local VCS state to the binary.
              GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false \
                -ldflags "$LDFLAGS" -o "loxicmd_${arch}.round${round}"
            done
            if ! cmp -s "loxicmd_${arch}.round1" "loxicmd_${arch}.round2"; then
              sha256sum "loxicmd_${arch}.round1" "loxicmd_${arch}.round2"
              echo "::error::linux/${arch} build is not reproducible: two builds from identical inputs differ"
              exit 1
            fi
            mv "loxicmd_${arch}.round1" "loxicmd_${arch}"
            rm "loxicmd_${arch}.round2"
          done
          # The build must not have modified any committed file (uncommitted
          # generated sources would make the tag a lie).
          git diff --exit-code || {
            echo "::error::the build modified committed files"
            exit 1
          }

      - name: Verify the binary reports the release identity
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REV: ${{ steps.inputs.outputs.revision }}
          CONTRACT: ${{ steps.inputs.outputs.contract }}
        run: |
          # The runner is linux/amd64, so the amd64 binary runs natively.
          # What the binary says about itself must match what this job knows
          # it built; anything else means the stamping pipeline lies.
          chmod +x loxicmd_amd64
          ./loxicmd_amd64 version -o json | tee version.json
          for check in \
            '.data.version == env.VERSION' \
            '.data.sourceRevision == env.REV' \
            '.data.gatewayContract == env.CONTRACT' \
            '.code == "OK"'; do
            jq -e "$check" version.json >/dev/null || {
              echo "::error::binary identity check failed: $check"
              exit 1
            }
          done

      - name: Package tarballs + checksums
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SDE: ${{ steps.inputs.outputs.sde }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            DIST="loxicmd-inference-gateway_${VERSION}_linux_${arch}"
            mkdir -p "dist/${DIST}"
            cp "loxicmd_${arch}" "dist/${DIST}/loxicmd"
            cp LICENSE NOTICE README.md "dist/${DIST}/"
            # Deterministic archive: fixed order, epoch from the commit,
            # no owner/group leakage, gzip without a timestamp header.
            tar -C dist --sort=name --mtime="@${SDE}" \
              --owner=0 --group=0 --numeric-owner \
              -cf "dist/${DIST}.tar" "${DIST}"
            gzip -n "dist/${DIST}.tar"
          done
          ( cd dist && sha256sum ./*.tar.gz > SHA256SUMS )

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/loxicmd-inference-gateway_${{ steps.ver.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write release metadata
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REV: ${{ steps.inputs.outputs.revision }}
          CONTRACT: ${{ steps.inputs.outputs.contract }}
          WORKFLOW: ${{ steps.inputs.outputs.workflow }}
          SDE: ${{ steps.inputs.outputs.sde }}
        run: |
          # Machine-readable identity for downstream product-lock intake:
          # which sources produced which artifact digests, verifiable offline
          # against SHA256SUMS and the provenance attestation.
          jq -n \
            --arg version "$VERSION" \
            --arg revision "$REV" \
            --arg contract "$CONTRACT" \
            --arg workflow "$WORKFLOW" \
            --arg sde "$SDE" \
            --arg go "$(go version | awk '{print $3}')" \
            --slurpfile identity version.json \
            '{
              apiVersion: "loxilb.io/appliance/v1",
              kind: "ReleaseMetadata",
              component: "loxicmd-inference-gateway",
              version: $version,
              sourceRevision: $revision,
              gatewayContract: $contract,
              goVersion: $go,
              buildWorkflow: $workflow,
              sourceDateEpoch: $sde,
              binaryIdentity: $identity[0].data,
              artifacts: []
            }' > release-metadata.tmp
          for f in dist/*.tar.gz dist/*.spdx.json; do
            jq --arg name "$(basename "$f")" \
               --arg sha256 "$(sha256sum "$f" | awk '{print $1}')" \
               '.artifacts += [{name: $name, sha256: $sha256}]' \
               release-metadata.tmp > release-metadata.next
            mv release-metadata.next release-metadata.tmp
          done
          mv release-metadata.tmp "dist/release-metadata_${VERSION}.json"
          cat "dist/release-metadata_${VERSION}.json"

      - name: Attest build provenance
        id: build_attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.spdx.json
            dist/release-metadata_*.json

      - name: Preserve build provenance bundle
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUNDLE: ${{ steps.build_attestation.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/build-provenance_${VERSION}.sigstore.json"

      - name: Write recovery release predicate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REV: ${{ steps.inputs.outputs.revision }}
          CONTRACT: ${{ steps.inputs.outputs.contract }}
          WORKFLOW: ${{ steps.inputs.outputs.workflow }}
          SDE: ${{ steps.inputs.outputs.sde }}
          BUILDER_WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          jq -n \
            --arg repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg ref "refs/tags/${VERSION}" \
            --arg revision "$REV" \
            --arg contract "$CONTRACT" \
            --arg workflow "$WORKFLOW" \
            --arg builderRevision "$BUILDER_WORKFLOW_REVISION" \
            --arg go "$(go env GOVERSION)" \
            --arg sde "$SDE" \
            '{
              purl: ("pkg:github/loxilb-io/loxicmd-inference-gateway@" + $revision),
              source: {
                repository: $repository,
                ref: $ref,
                artifactSourceRevision: $revision,
                annotatedTagObjectVerified: true
              },
              build: {
                gatewayContract: $contract,
                workflow: $workflow,
                builderWorkflowRevision: $builderRevision,
                goVersion: $go,
                sourceDateEpoch: $sde,
                reproducibilityRounds: 2
              }
            }' > dist/release-predicate.json

      - name: Attest recovered release inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: recovery_attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.spdx.json
            dist/release-metadata_*.json
            dist/build-provenance_*.sigstore.json
          predicate-type: https://in-toto.io/attestation/release/v0.1
          predicate-path: dist/release-predicate.json

      - name: Preserve recovery attestation bundle
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUNDLE: ${{ steps.recovery_attestation.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/release-attestation_${VERSION}.sigstore.json"

      - name: Re-verify remote tag immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          REV: ${{ steps.inputs.outputs.revision }}
          LOCAL_TAG_OBJECT: ${{ steps.inputs.outputs.tag_object }}
        run: |
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}")"
          REMOTE_TYPE="$(jq -r '.object.type' <<<"$REF_JSON")"
          REMOTE_TAG_OBJECT="$(jq -r '.object.sha' <<<"$REF_JSON")"
          if [ "$REMOTE_TYPE" != "tag" ] || [ "$REMOTE_TAG_OBJECT" != "$LOCAL_TAG_OBJECT" ]; then
            echo "::error::remote tag object changed after checkout"
            exit 1
          fi

          TAG_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REMOTE_TAG_OBJECT}")"
          REMOTE_TARGET="$(jq -r '.object.sha' <<<"$TAG_JSON")"
          if [ "$REMOTE_TARGET" != "$REV" ]; then
            echo "::error::remote tag target ${REMOTE_TARGET} does not match ${REV}"
            exit 1
          fi

      - name: Create, verify, and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          REV: ${{ steps.inputs.outputs.revision }}
          LOCAL_TAG_OBJECT: ${{ steps.inputs.outputs.tag_object }}
        run: |
          ASSETS=(
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.spdx.json
            dist/release-metadata_*.json
            dist/build-provenance_*.sigstore.json
          )
          if compgen -G 'dist/release-attestation_*.sigstore.json' >/dev/null; then
            ASSETS+=(dist/release-attestation_*.sigstore.json)
          fi

          CREATE_ARGS=(--draft --generate-notes --verify-tag)
          if [ "$PRERELEASE" = true ]; then
            CREATE_ARGS+=(--prerelease)
          fi
          gh release create "$VERSION" "${ASSETS[@]}" "${CREATE_ARGS[@]}" \
            --repo "$GITHUB_REPOSITORY"

          # GitHub intentionally returns 404 from /releases/tags/{tag} for a
          # draft. Resolve the one draft by tag, then use its immutable API ID
          # for verification and the publish transition.
          DRAFT_ID="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"${VERSION}\") | .id")"
          if ! [[ "$DRAFT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::expected exactly one draft release for ${VERSION}; got ${DRAFT_ID//$'\n'/,}"
            exit 1
          fi
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}")"
          if [ "$(jq -r '.draft' <<<"$RELEASE_JSON")" != true ]; then
            echo "::error::release must remain a draft until every uploaded asset is verified"
            exit 1
          fi
          if [ "$(jq '.assets | length' <<<"$RELEASE_JSON")" -ne "${#ASSETS[@]}" ]; then
            echo "::error::draft asset count does not match the complete local set"
            exit 1
          fi

          for file in "${ASSETS[@]}"; do
            name="$(basename "$file")"
            local_digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            remote_digest="$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .digest' <<<"$RELEASE_JSON")"
            if [ "$remote_digest" != "$local_digest" ]; then
              echo "::error::uploaded digest mismatch for ${name}: ${remote_digest} != ${local_digest}"
              exit 1
            fi
          done

          # Asset upload can take long enough for an unprotected ref to move.
          # Re-read both the tag object and its peeled commit before the draft
          # becomes public.
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}")"
          REMOTE_TAG_OBJECT="$(jq -r '.object.sha' <<<"$REF_JSON")"
          TAG_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REMOTE_TAG_OBJECT}")"
          REMOTE_TARGET="$(jq -r '.object.sha' <<<"$TAG_JSON")"
          if [ "$(jq -r '.object.type' <<<"$REF_JSON")" != tag ] || \
             [ "$REMOTE_TAG_OBJECT" != "$LOCAL_TAG_OBJECT" ] || \
             [ "$REMOTE_TARGET" != "$REV" ]; then
            echo "::error::remote tag changed while the release draft was being assembled"
            exit 1
          fi

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" \
            -F draft=false -f make_latest=false >/dev/null
          PUBLISHED_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}")"
          if [ "$(jq -r '.draft' <<<"$PUBLISHED_JSON")" != false ] || \
             [ "$(jq -r '.immutable' <<<"$PUBLISHED_JSON")" != true ]; then
            echo "::error::published release is not confirmed immutable"
            exit 1
          fi
