name: Build-CI

# Blocking PR gate: format, build, vet, unit tests, and golangci-lint.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: loxicmd-inference-gateway-build-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '>=1.25.0'
          cache: true

      - name: Check formatting
        # gofmt -l lists files that are not properly formatted; any output fails.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '>=1.25.0'
          cache: true
      # Install a pinned golangci-lint v2 via `go install` so the linter is
      # built with the same Go toolchain as the module, avoiding
      # linter-vs-toolchain version skew in typecheck.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m ./...

  gateway-contract:
    name: gateway-api-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The consumed-contract fixture is only meaningful against the producer's
    # spec. Running it here, and the same fixture in the gateway repo's own CI,
    # is what makes a unilateral change on either side go red instead of
    # silently drifting until a release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: loxilb-io/loxilb-inference-gateway
          ref: main
          path: gateway
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '>=1.25.0'
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Compare the consumed contract with the gateway spec
        working-directory: cli
        env:
          GATEWAY_REPO: ${{ github.workspace }}/gateway
        run: go test ./pkg/api/ -run 'TestGatewayContract|TestLifecycleModels|TestLifecycleEnums' -v
