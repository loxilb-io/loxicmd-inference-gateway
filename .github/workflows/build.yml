name: Build-CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  build:
    name: loxicmd-inference-gateway-build-ci
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '>=1.25.0'
    - name: Build
      run: make
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test ./...
    - name: gofmt
      run: test -z "$(gofmt -l .)" || (echo 'gofmt needed on:'; gofmt -l .; exit 1)
