version: "2"

linters:
  default: none
  enable:
    - forbidigo
    - govet
    - ineffassign
    - misspell
    - revive
  settings:
    forbidigo:
      # The exit-code taxonomy depends on cmd/root.go being the single
      # exit point: a command that calls os.Exit bypasses classification
      # and steals the exit status. cmd/guards_test.go enforces the same
      # rule (plus the Run:-handler and stderr-print rules) structurally;
      # this linter makes the violation visible in editors and CI listings.
      forbid:
        - pattern: ^os\.Exit$
          msg: only the single exit point in cmd/root.go may call os.Exit (exit-code taxonomy)
    revive:
      rules:
        # Bug-catching / safe rules kept enabled.
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: unreachable-code
        - name: var-declaration
        # Deferred as tech-debt for the public launch: enforcing doc comments
        # on every exported symbol and renaming exported API model types would
        # either block CI or risk JSON/API-compat changes (the models mirror
        # the gateway swagger), and unused-parameter fires on every cobra
        # callback signature inherited from upstream loxicmd. Tighten
        # incrementally post-launch.
        - name: unused-parameter
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: true

  exclusions:
    rules:
      # The single exit point itself.
      - path: cmd/root\.go
        linters: [forbidigo]
formatters:
  enable:
    - gofmt
